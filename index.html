<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狼人殺 Werewolf</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 font-sans selection:bg-indigo-500 relative">
    <div id="app" class="max-w-3xl mx-auto">
        <div class="text-center mt-20 text-xl text-slate-400">系統載入中...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB9sxYCA7_ayevgpY9BtWrK7nHJIR7bkv8",
            authDomain: "diddy-test.firebaseapp.com",
            databaseURL: "https://diddy-test-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "diddy-test",
            storageBucket: "diddy-test.firebasestorage.app",
            messagingSenderId: "440500416154",
            appId: "1:440500416154:web:9da15df2b9e1d24ea4f923",
            measurementId: "G-K4CYPM9SWR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        let user = null;
        let roomId = null;
        let roomData = null;
        let playerName = localStorage.getItem("werewolf_playerName") || "";
        let error = "";
        let isTransitioning = false;
        let isAuthChecking = true;

        let showProfileModal = false;
        let selectedIcon = localStorage.getItem("werewolf_playerIcon") || "👤"; 
        const availableIcons = ["👤", "⚔️", "🐺", "🧙‍♀️", "🔮", "👦", "👧", "🤡", "👻", "👽", "🤖", "🐱", "🐶"];

        onAuthStateChanged(auth, (currentUser) => {
            user = currentUser;
            isAuthChecking = false;
            playerName = localStorage.getItem("werewolf_playerName") || (user?.displayName || "");
            selectedIcon = localStorage.getItem("werewolf_playerIcon") || "👤";
            render();
        });

        window.loginWithGoogle = async () => { try { await signInWithPopup(auth, googleProvider); } catch (err) { showError("Google 登入失敗"); } };
        window.loginWithEmail = async () => {
            const email = document.getElementById('emailInput').value;
            const pw = document.getElementById('pwInput').value;
            if(!email || !pw) return showError("請輸入信箱與密碼");
            try { await signInWithEmailAndPassword(auth, email, pw); } catch (err) { showError("登入失敗"); }
        };
        window.registerWithEmail = async () => {
            const email = document.getElementById('emailInput').value;
            const pw = document.getElementById('pwInput').value;
            if(!email || !pw) return showError("請輸入信箱與密碼");
            try { await createUserWithEmailAndPassword(auth, email, pw); } catch (err) { showError("註冊失敗"); }
        };
        window.loginAnonymously = async () => { try { await signInAnonymously(auth); } catch (err) { showError("訪客登入失敗"); } };
        window.logout = async () => { await signOut(auth); roomId = null; roomData = null; if(unsubscribeRoom) unsubscribeRoom(); render(); };

        window.openProfileEditor = () => {
            showProfileModal = true;
            const myData = roomData?.players[user?.uid];
            if (myData && myData.icon) selectedIcon = myData.icon;
            render();
        };
        window.closeProfileEditor = () => { showProfileModal = false; render(); };
        window.selectIcon = (icon) => { selectedIcon = icon; render(); };

        window.handleImageUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 120;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                    } else {
                        if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    selectedIcon = canvas.toDataURL('image/jpeg', 0.8);
                    render();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.saveProfile = async () => {
            const newName = document.getElementById('editPlayerName').value;
            if (!newName.trim()) return alert("請輸入暱稱！");
            playerName = newName;
            
            localStorage.setItem("werewolf_playerName", playerName);
            localStorage.setItem("werewolf_playerIcon", selectedIcon);

            if (roomId && roomData && roomData.players[user.uid]) {
                const roomRef = doc(db, "rooms", roomId);
                await updateDoc(roomRef, { [`players.${user.uid}.name`]: newName, [`players.${user.uid}.icon`]: selectedIcon });
            }
            showProfileModal = false;
            render();
        };

        function getIconHTML(iconData, extraClasses = "w-full h-full text-4xl") {
            if (!iconData) return `<span class="${extraClasses} flex items-center justify-center">👤</span>`;
            if (iconData.startsWith('data:image')) {
                return `<img src="${iconData}" class="rounded-full object-cover shadow-sm ${extraClasses}" style="aspect-ratio: 1/1;" />`;
            }
            return `<span class="${extraClasses} flex items-center justify-center">${iconData}</span>`;
        }

        function checkTimersAndRender() {
            if (!roomData || isTransitioning || roomData.phase === 'lobby') return;
            const now = Date.now();
            const isHost = roomData.hostId === user?.uid;

            if (roomData.phase === 'night') {
                const elapsed = Math.floor((now - roomData.nightStartTime) / 1000);
                if ((elapsed >= 45 && isHost) || elapsed >= 47) window.endNight();
                else render();
            } else if (roomData.phase === 'day_speech') {
                const elapsed = Math.floor((now - roomData.speakerStartTime) / 1000);
                if ((elapsed >= 25 && isHost) || elapsed >= 27) window.nextSpeaker();
                else render();
            } else if (roomData.phase === 'day_free') {
                const elapsed = Math.floor((now - roomData.dayStartTime) / 1000);
                if ((elapsed >= 60 && isHost) || elapsed >= 62) window.startVoting();
                else render();
            } else if (roomData.phase === 'vote') {
                const elapsed = Math.floor((now - roomData.voteStartTime) / 1000);
                if ((elapsed >= 25 && isHost) || elapsed >= 27) window.endVoting();
                else render();
            } else {
                render();
            }
        }

        setInterval(checkTimersAndRender, 1000);
        document.addEventListener("visibilitychange", () => { if (document.visibilityState === 'visible') checkTimersAndRender(); });

        const generateRoomCode = () => Math.random().toString(36).substring(2, 8).toUpperCase();
        function showError(msg) { error = msg; render(); setTimeout(() => { error = ""; render(); }, 3000); }

        window.createRoom = async () => {
            const nameInput = document.getElementById('playerName').value;
            if (!nameInput.trim()) return showError("請輸入玩家名稱");
            playerName = nameInput;
            localStorage.setItem("werewolf_playerName", playerName);
            localStorage.setItem("werewolf_playerIcon", selectedIcon);
            const newRoomId = generateRoomCode();
            await setDoc(doc(db, "rooms", newRoomId), {
                hostId: user.uid, phase: "lobby",
                players: { [user.uid]: { name: playerName, icon: selectedIcon, isAlive: true, role: null } },
                roleSettings: { wolf: 1, seer: 1, witch: 1, knight: 0, villager: 0 },
                nightStartTime: 0, speakerStartTime: 0, speechOrder: [], currentSpeakerIndex: 0, dayStartTime: 0, voteStartTime: 0,
                nightActions: { wolfTarget: null, seerTarget: null, witchSave: false, witchPoisonTarget: null }, daySkips: {}, dayVotes: {},
                systemMessage: "等待玩家加入中..."
            });
            roomId = newRoomId; listenToRoom(roomId);
        };

        window.joinRoom = async () => {
            const nameInput = document.getElementById('playerName').value;
            const codeInput = document.getElementById('roomCode').value.toUpperCase();
            if (!nameInput.trim() || !codeInput.trim()) return showError("請輸入名稱與代碼");
            playerName = nameInput;
            localStorage.setItem("werewolf_playerName", playerName);
            localStorage.setItem("werewolf_playerIcon", selectedIcon);
            try {
                await setDoc(doc(db, "rooms", codeInput), { players: { [user.uid]: { name: playerName, icon: selectedIcon, isAlive: true, role: null } } }, { merge: true });
                roomId = codeInput; listenToRoom(roomId);
            } catch (err) { showError("無法加入房間，請檢查代碼或權限"); }
        };

        window.leaveRoom = async () => {
            if (!roomId || !user) return;
            try {
                const roomRef = doc(db, "rooms", roomId);
                localStorage.setItem("werewolf_playerName", playerName);
                localStorage.setItem("werewolf_playerIcon", selectedIcon);
                await updateDoc(roomRef, { [`players.${user.uid}`]: null });
                if (unsubscribeRoom) unsubscribeRoom();
                roomId = null; roomData = null;
                render();
            } catch (err) { alert("離開房間時發生錯誤：" + err.message); }
        };

        let unsubscribeRoom = null;
        function listenToRoom(id) {
            if (unsubscribeRoom) unsubscribeRoom();
            unsubscribeRoom = onSnapshot(doc(db, "rooms", id), (docSnap) => {
                isTransitioning = false;
                if (docSnap.exists()) { 
                    roomData = docSnap.data(); 
                    console.log("Room Data Synced:", roomData.phase);
                    render(); 
                } 
                else { showError("房間不存在"); roomId = null; roomData = null; render(); }
            }, (error) => {
                console.error("Firestore Snapshot Error:", error);
                showError("與伺服器連線中斷或權限不足");
            });
        }

        window.updateRoleSetting = async (role, delta) => {
            if (roomData.phase !== 'lobby' || roomData.hostId !== user.uid) return;
            const currentSettings = roomData.roleSettings || { wolf: 1, seer: 1, witch: 1, knight: 0, villager: 0 };
            const newValue = Math.max(0, (currentSettings[role] || 0) + delta);
            await updateDoc(doc(db, "rooms", roomId), { [`roleSettings.${role}`]: newValue });
        };

        window.startGame = async () => {
            try {
                const playerIds = Object.keys(roomData.players);
                const settings = roomData.roleSettings || { wolf: 1, seer: 1, witch: 1, knight: 0, villager: 0 };
                const totalRoles = (settings.wolf || 0) + (settings.seer || 0) + (settings.witch || 0) + (settings.knight || 0) + (settings.villager || 0);
                
                if (totalRoles !== playerIds.length) {
                    alert(`⚠️ 無法開始遊戲！\n當前玩家人數：${playerIds.length} 人\n設定的角色總數：${totalRoles} 個\n請增加玩家或調整角色數量，使兩者一致。`);
                    return showError(`角色數量 (${totalRoles}) 與玩家人數 (${playerIds.length}) 不符！`);
                }

                let rolePool = [];
                for (let i = 0; i < (settings.wolf || 0); i++) rolePool.push("狼人");
                for (let i = 0; i < (settings.seer || 0); i++) rolePool.push("預言家");
                for (let i = 0; i < (settings.witch || 0); i++) rolePool.push("女巫");
                for (let i = 0; i < (settings.knight || 0); i++) rolePool.push("騎士");
                for (let i = 0; i < (settings.villager || 0); i++) rolePool.push("平民");
                
                for (let i = rolePool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [rolePool[i], rolePool[j]] = [rolePool[j], rolePool[i]];
                }

                const newPlayers = JSON.parse(JSON.stringify(roomData.players));
                
                playerIds.forEach((id, index) => {
                    const assignedRole = rolePool[index];
                    newPlayers[id].role = assignedRole;
                    newPlayers[id].isAlive = true;
                    if (assignedRole === "女巫") { 
                        newPlayers[id].hasHeal = true; 
                        newPlayers[id].hasPoison = true; 
                    } else { 
                        delete newPlayers[id].hasHeal; 
                        delete newPlayers[id].hasPoison; 
                    }
                    if (assignedRole === "騎士") { 
                        newPlayers[id].hasKnightAbility = true; 
                    } else { 
                        delete newPlayers[id].hasKnightAbility; 
                    }
                });

                await updateDoc(doc(db, "rooms", roomId), {
                    players: newPlayers, 
                    phase: "night", 
                    nightStartTime: Date.now(),
                    nightActions: { wolfTarget: null, seerTarget: null, witchSave: false, witchPoisonTarget: null },
                    daySkips: {}, 
                    dayVotes: {}, 
                    systemMessage: "天黑請閉眼，45 秒夜晚行動開始..."
                });
            } catch (error) {
                console.error("Start Game Error:", error);
                alert("開始遊戲失敗，請檢查網路或資料庫權限：" + error.message);
            }
        };

        window.returnToLobby = async () => {
            if (roomData.phase !== 'game_over' || roomData.hostId !== user.uid || isTransitioning) return;
            isTransitioning = true;
            const newPlayers = JSON.parse(JSON.stringify(roomData.players));
            Object.keys(newPlayers).forEach(id => { newPlayers[id].isAlive = true; newPlayers[id].role = null; });
            await updateDoc(doc(db, "rooms", roomId), {
                phase: "lobby", players: newPlayers, systemMessage: "等待房主重新開始遊戲..."
            });
        };

        window.handleWolfAction = async (targetId) => await updateDoc(doc(db, "rooms", roomId), { "nightActions.wolfTarget": targetId });
        window.handleSeerAction = async (targetId) => {
            if (roomData.nightActions?.seerTarget) return alert("今晚已查驗過！");
            await updateDoc(doc(db, "rooms", roomId), { "nightActions.seerTarget": targetId });
            alert(`查驗結果：${roomData.players[targetId].name} 是 ${roomData.players[targetId].role === "狼人" ? "壞人" : "好人"}`);
        };
        window.handleWitchHeal = async (useSave) => await updateDoc(doc(db, "rooms", roomId), { "nightActions.witchSave": useSave });
        window.handleWitchPoison = async (targetId) => await updateDoc(doc(db, "rooms", roomId), { "nightActions.witchPoisonTarget": targetId });

        window.handleKnightDuel = async (targetId) => {
            if (!roomData || isTransitioning) return;
            const myPlayer = roomData.players[user.uid];
            if (myPlayer?.role !== '騎士' || !myPlayer?.hasKnightAbility || !myPlayer?.isAlive) return;

            const targetPlayer = roomData.players[targetId];
            if (!targetPlayer || !targetPlayer.isAlive) return;

            if (!confirm(`確定要對 ${targetPlayer.name} 發動騎士決鬥嗎？技能一局只能使用一次！`)) return;

            isTransitioning = true;
            const newPlayers = JSON.parse(JSON.stringify(roomData.players));
            newPlayers[user.uid].hasKnightAbility = false;

            let duelMsg = "";
            const isTargetWolf = targetPlayer.role === "狼人";

            if (isTargetWolf) {
                newPlayers[targetId].isAlive = false;
                duelMsg = `⚔️ 騎士【${myPlayer.name}】發動決鬥！\n【${targetPlayer.name}】是狼人，當場死亡！`;
            } else {
                newPlayers[user.uid].isAlive = false;
                duelMsg = `⚔️ 騎士【${myPlayer.name}】發動決鬥！\n【${targetPlayer.name}】是好人，騎士【${myPlayer.name}】以死謝罪身亡！`;
            }

            const alivePlayers = Object.values(newPlayers).filter(p => p.isAlive);
            const aliveWolves = alivePlayers.filter(p => p.role === "狼人").length;
            const roomRef = doc(db, "rooms", roomId);

            if (aliveWolves === 0) {
                await updateDoc(roomRef, { players: newPlayers, phase: "game_over", systemMessage: `${duelMsg}\n🎉 好人陣營獲勝！` });
            } else if (aliveWolves >= (alivePlayers.length - aliveWolves)) {
                await updateDoc(roomRef, { players: newPlayers, phase: "game_over", systemMessage: `${duelMsg}\n🐺 狼人陣營獲勝！` });
            } else {
                await updateDoc(roomRef, { players: newPlayers, systemMessage: duelMsg });
            }
        };

        window.nextSpeaker = async () => {
            if (roomData.phase !== 'day_speech' || isTransitioning) return;
            isTransitioning = true;
            const order = roomData.speechOrder || [];
            const nextIndex = (roomData.currentSpeakerIndex || 0) + 1;
            if (nextIndex >= order.length) {
                await updateDoc(doc(db, "rooms", roomId), { phase: "day_free", dayStartTime: Date.now(), daySkips: {}, systemMessage: "進入自由討論階段。" });
            } else {
                await updateDoc(doc(db, "rooms", roomId), { currentSpeakerIndex: nextIndex, speakerStartTime: Date.now(), systemMessage: `輪到 ${roomData.players[order[nextIndex]]?.name} 發言...` });
            }
        };

        window.handleSkipDiscussion = async () => {
            if (roomData.phase !== 'day_free' || !roomData.players[user.uid]?.isAlive) return;
            const newSkips = { ...(roomData.daySkips || {}), [user.uid]: true };
            await updateDoc(doc(db, "rooms", roomId), { daySkips: newSkips });
            if (Object.keys(newSkips).length / Object.values(roomData.players).filter(p => p.isAlive).length > 0.75) window.startVoting();
        };

        window.startVoting = async () => {
            if (roomData.phase === 'vote' || isTransitioning) return;
            isTransitioning = true;
            await updateDoc(doc(db, "rooms", roomId), { phase: "vote", voteStartTime: Date.now(), dayVotes: {}, systemMessage: "進入投票階段。" });
        };

        window.handleVote = async (targetId) => {
            if (roomData.phase !== 'vote' || !roomData.players[user.uid]?.isAlive) return;
            await updateDoc(doc(db, "rooms", roomId), { [`dayVotes.${user.uid}`]: targetId });
        };

        window.endNight = async () => {
            if (roomData.phase !== "night" || isTransitioning) return;
            isTransitioning = true;
            const { wolfTarget, witchSave, witchPoisonTarget } = roomData.nightActions;
            const newPlayers = JSON.parse(JSON.stringify(roomData.players));
            let deaths = [];

            if (wolfTarget) {
                if (witchSave) {
                    const witchId = Object.keys(newPlayers).find(id => newPlayers[id].role === '女巫');
                    if (witchId) newPlayers[witchId].hasHeal = false;
                } else {
                    newPlayers[wolfTarget].isAlive = false; deaths.push(newPlayers[wolfTarget].name);
                }
            }
            if (witchPoisonTarget) {
                const witchId = Object.keys(newPlayers).find(id => newPlayers[id].role === '女巫');
                if (witchId) newPlayers[witchId].hasPoison = false;
                newPlayers[witchPoisonTarget].isAlive = false;
                if (!deaths.includes(newPlayers[witchPoisonTarget].name)) deaths.push(newPlayers[witchPoisonTarget].name);
            }

            let msg = deaths.length === 0 ? "昨晚是個平安夜。" : `昨晚死亡的玩家：${deaths.join('、 ')}。`;
            const alivePlayers = Object.values(newPlayers).filter(p => p.isAlive);
            const aliveWolves = alivePlayers.filter(p => p.role === "狼人").length;
            const roomRef = doc(db, "rooms", roomId);

            if (aliveWolves === 0) await updateDoc(roomRef, { players: newPlayers, phase: "game_over", systemMessage: `${msg}\n🎉 好人陣營獲勝！` });
            else if (aliveWolves >= (alivePlayers.length - aliveWolves)) await updateDoc(roomRef, { players: newPlayers, phase: "game_over", systemMessage: `${msg}\n🐺 狼人陣營獲勝！` });
            else {
                const aliveIds = Object.keys(newPlayers).filter(id => newPlayers[id].isAlive);
                const shuffledSpeechOrder = [...aliveIds].sort(() => 0.5 - Math.random());
                await updateDoc(roomRef, {
                    players: newPlayers, phase: "day_speech", speechOrder: shuffledSpeechOrder, currentSpeakerIndex: 0, speakerStartTime: Date.now(), daySkips: {}, dayVotes: {},
                    systemMessage: `${msg}\n由 ${newPlayers[shuffledSpeechOrder[0]]?.name} 開始發言。`
                });
            }
        };

        window.endVoting = async () => {
            if (roomData.phase !== "vote" || isTransitioning) return;
            isTransitioning = true;
            const tally = {};
            Object.values(roomData.dayVotes || {}).forEach(targetId => tally[targetId] = (tally[targetId] || 0) + 1);

            let maxVotes = 0, banishedId = null, isTie = false;
            Object.entries(tally).forEach(([targetId, count]) => {
                if (count > maxVotes) { maxVotes = count; banishedId = targetId; isTie = false; } 
                else if (count === maxVotes && maxVotes > 0) isTie = true;
            });

            const newPlayers = JSON.parse(JSON.stringify(roomData.players));
            let resultMsg = "";
            if (maxVotes > 0 && !isTie && banishedId) {
                newPlayers[banishedId].isAlive = false; resultMsg = `${newPlayers[banishedId].name} 被放逐了。`;
            } else {
                resultMsg = isTie ? `最高票平票，今日無人被放逐。` : "無人投票，今日無人被放逐。";
            }

            const alivePlayers = Object.values(newPlayers).filter(p => p.isAlive);
            const aliveWolves = alivePlayers.filter(p => p.role === "狼人").length;
            const roomRef = doc(db, "rooms", roomId);

            if (aliveWolves === 0) await updateDoc(roomRef, { players: newPlayers, phase: "game_over", systemMessage: `${resultMsg}\n🎉 好人陣營獲勝！` });
            else if (aliveWolves >= (alivePlayers.length - aliveWolves)) await updateDoc(roomRef, { players: newPlayers, phase: "game_over", systemMessage: `${resultMsg}\n🐺 狼人陣營獲勝！` });
            else await updateDoc(roomRef, { players: newPlayers, phase: "night", nightStartTime: Date.now(), nightActions: { wolfTarget: null, seerTarget: null, witchSave: false, witchPoisonTarget: null }, systemMessage: `${resultMsg} 天黑請閉眼...` });
        };

        window.copyCode = () => { navigator.clipboard.writeText(roomId); alert("已複製房間代碼！"); };

        function render() {
            const appDiv = document.getElementById('app');
            if (isAuthChecking) return;

            let profileModalUI = '';
            if (showProfileModal) {
                profileModalUI = `
                    <div class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                        <div class="bg-slate-800 p-6 rounded-xl border border-slate-600 shadow-2xl w-full max-w-sm max-h-[90vh] overflow-y-auto">
                            <h3 class="text-xl font-bold mb-4 text-indigo-400">編輯個人資料</h3>
                            <label class="block text-slate-300 text-sm mb-2">更改暱稱</label>
                            <input id="editPlayerName" class="w-full bg-slate-700 p-3 rounded-lg mb-4 text-lg outline-none focus:ring-2 focus:ring-indigo-500 text-white" value="${roomData?.players[user.uid]?.name || playerName}">
                            <div class="mb-4">
                                <label class="block text-slate-300 text-sm mb-2">目前頭像</label>
                                <div class="flex justify-center p-2 rounded-lg bg-slate-700 w-24 h-24 mx-auto items-center">
                                    ${getIconHTML(selectedIcon, "w-20 h-20")}
                                </div>
                            </div>
                            <label class="block text-slate-300 text-sm mb-2">上傳照片 (將自動壓縮)</label>
                            <input type="file" accept="image/*" onchange="window.handleImageUpload(event)" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 mb-4 cursor-pointer bg-slate-700 p-2 rounded-lg">
                            <label class="block text-slate-300 text-sm mb-2">或選擇預設圖示</label>
                            <div class="grid grid-cols-4 gap-2 mb-6">
                                ${availableIcons.map(icon => `<button onclick="window.selectIcon('${icon}')" class="text-3xl p-2 rounded-lg transition-all ${selectedIcon === icon ? 'bg-indigo-600 ring-2 ring-indigo-400' : 'bg-slate-700 hover:bg-slate-600'}">${icon}</button>`).join('')}
                            </div>
                            <div class="flex gap-3">
                                <button onclick="window.closeProfileEditor()" class="w-1/2 bg-slate-600 hover:bg-slate-500 transition p-3 rounded-lg font-bold">取消</button>
                                <button onclick="window.saveProfile()" class="w-1/2 bg-indigo-600 hover:bg-indigo-500 transition p-3 rounded-lg font-bold">儲存</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            if (!user) {
                appDiv.innerHTML = `
                    <div class="flex flex-col items-center justify-center min-h-[85vh]">
                        <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md text-center border border-slate-700">
                            <h1 class="text-3xl font-bold mb-8 tracking-widest text-indigo-400">🐺 狼人殺</h1>
                            <input id="emailInput" type="email" class="w-full bg-slate-700 p-3 rounded-lg mb-3 text-lg outline-none focus:ring-2 focus:ring-indigo-500 placeholder-slate-400" placeholder="電子郵件">
                            <input id="pwInput" type="password" class="w-full bg-slate-700 p-3 rounded-lg mb-6 text-lg outline-none focus:ring-2 focus:ring-indigo-500 placeholder-slate-400" placeholder="密碼">
                            <div class="flex gap-3 mb-6">
                                <button onclick="window.loginWithEmail()" class="w-1/2 bg-indigo-600 hover:bg-indigo-500 transition p-3 rounded-lg font-bold shadow">信箱登入</button>
                                <button onclick="window.registerWithEmail()" class="w-1/2 bg-slate-600 hover:bg-slate-500 transition p-3 rounded-lg font-bold shadow">信箱註冊</button>
                            </div>
                            <button onclick="window.loginWithGoogle()" class="w-full bg-white text-slate-900 hover:bg-gray-100 transition p-3 rounded-lg font-bold flex justify-center items-center gap-3 shadow mb-3">Google 登入</button>
                            <button onclick="window.loginAnonymously()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 transition p-3 rounded-lg font-bold shadow">訪客 (匿名) 登入</button>
                            ${error ? `<p class="text-red-400 mt-4">${error}</p>` : ''}
                        </div>
                    </div>
                `;
                return;
            }

            if (!roomId || !roomData) {
                const userDisplay = user.email || user.displayName || '訪客';
                appDiv.innerHTML = `
                    ${profileModalUI}
                    <div class="flex flex-col items-center justify-center min-h-[80vh]">
                        <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md text-center border border-slate-700">
                            <h1 class="text-3xl font-bold mb-4 tracking-widest text-indigo-400">🐺 狼人殺</h1>
                            <div class="mb-6 bg-slate-700 p-2 rounded-lg text-sm text-slate-300 flex justify-between items-center">
                                <span>登入身分: <span class="font-bold text-white">${userDisplay}</span></span>
                                <button onclick="window.logout()" class="text-red-400 hover:text-red-300 font-bold bg-slate-800 px-3 py-1 rounded">登出</button>
                            </div>
                            <div class="flex items-center justify-center gap-3 mb-4">
                                <div class="w-14 h-14 bg-slate-700 rounded-lg overflow-hidden flex justify-center items-center">${getIconHTML(selectedIcon, "w-full h-full text-3xl")}</div>
                                <input id="playerName" class="flex-1 bg-slate-700 p-3 rounded-lg text-center text-lg outline-none focus:ring-2 focus:ring-indigo-500 placeholder-slate-400" placeholder="輸入暱稱" value="${playerName}">
                            </div>
                            <button onclick="window.openProfileEditor()" class="w-full bg-slate-600 hover:bg-slate-500 transition p-2 rounded-lg font-bold shadow mb-6 text-sm">✏️ 編輯頭像與暱稱</button>
                            <div class="flex gap-4 mb-4">
                                <input id="roomCode" class="w-1/2 bg-slate-700 p-3 rounded-lg text-center text-lg outline-none uppercase focus:ring-2 focus:ring-indigo-500 placeholder-slate-400" placeholder="房間代碼">
                                <button onclick="window.joinRoom()" class="w-1/2 bg-indigo-600 hover:bg-indigo-500 transition p-3 rounded-lg font-bold shadow">加入房間</button>
                            </div>
                            <button onclick="window.createRoom()" class="w-full mt-4 bg-slate-600 hover:bg-slate-500 transition p-3 rounded-lg font-bold shadow">創建新房間</button>
                            ${error ? `<p class="text-red-400 mt-4">${error}</p>` : ''}
                        </div>
                    </div>
                `;
                return;
            }

            const isHost = roomData.hostId === user.uid;
            const myData = roomData.players[user.uid] || {};
            const allPlayers = Object.entries(roomData.players);
            const totalAlive = allPlayers.filter(([_, p]) => p.isAlive).length;
            const now = Date.now();

            let phaseText = '';
            if(roomData.phase === 'lobby') phaseText = '等待中';
            if(roomData.phase === 'night') {
                const elapsed = Math.max(0, Math.floor((now - roomData.nightStartTime) / 1000));
                if (elapsed < 15) phaseText = `🌙 狼人 (${Math.max(0, 15 - elapsed)}s)`;
                else if (elapsed < 30) phaseText = `🔮 預言家 (${Math.max(0, 30 - elapsed)}s)`;
                else phaseText = `🧪 女巫 (${Math.max(0, 45 - elapsed)}s)`;
            }
            if(roomData.phase === 'day_speech') {
                const elapsed = Math.max(0, Math.floor((now - roomData.speakerStartTime) / 1000));
                phaseText = `🎤 發言中 (${Math.max(0, 25 - elapsed)}s)`;
            }
            if(roomData.phase === 'day_free') phaseText = `☀️ 自由討論 (${Math.max(0, 60 - Math.floor((now - roomData.dayStartTime) / 1000))}s)`;
            if(roomData.phase === 'vote') phaseText = `🗳️ 投票階段 (${Math.max(0, 25 - Math.floor((now - roomData.voteStartTime) / 1000))}s)`;
            if(roomData.phase === 'game_over') phaseText = '🏆 遊戲結束';

            let roleSetupUI = '';
            if (roomData.phase === 'lobby') {
                const settings = roomData.roleSettings || { wolf: 1, seer: 1, witch: 1, knight: 0, villager: 0 };
                const totalRoles = (settings.wolf || 0) + (settings.seer || 0) + (settings.witch || 0) + (settings.knight || 0) + (settings.villager || 0);
                roleSetupUI = `
                    <div class="bg-slate-700/80 p-5 rounded-xl mt-4 mb-2 border border-slate-600 text-left">
                        <h3 class="text-lg font-bold text-amber-400 mb-3 flex justify-between items-center">
                            <span>⚙️ 遊戲角色配置</span>
                            <span class="text-sm text-slate-300">角色總數: <span class="${totalRoles === allPlayers.length ? 'text-green-400' : 'text-red-400'} font-bold text-lg">${totalRoles}</span> / 玩家人數: <span class="font-bold text-lg">${allPlayers.length}</span></span>
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            ${['wolf', 'seer', 'witch', 'knight', 'villager'].map(role => {
                                const labels = { wolf: '🐺 狼人', seer: '🔮 預言家', witch: '🧪 女巫', knight: '⚔️ 騎士', villager: '🧑‍🌾 平民' };
                                return `<div class="flex justify-between items-center bg-slate-800 p-3 rounded-lg border border-slate-700">
                                    <span class="font-bold">${labels[role]}</span>
                                    <div class="flex items-center gap-3">
                                        ${isHost ? `<button onclick="window.updateRoleSetting('${role}', -1)" class="bg-slate-600 hover:bg-slate-500 text-white w-8 h-8 rounded font-bold">-</button>` : ''}
                                        <span class="w-6 text-center font-bold text-lg text-indigo-300">${settings[role] || 0}</span>
                                        ${isHost ? `<button onclick="window.updateRoleSetting('${role}', 1)" class="bg-slate-600 hover:bg-slate-500 text-white w-8 h-8 rounded font-bold">+</button>` : ''}
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            const currentSpeakerId = roomData.phase === 'day_speech' ? roomData.speechOrder?.[roomData.currentSpeakerIndex] : null;

            let playersHTML = allPlayers.map(([id, player]) => {
                let isSpeaking = id === currentSpeakerId;
                let cardClass = player.isAlive 
                    ? (isSpeaking ? 'border-amber-400 bg-amber-950/40 shadow-lg shadow-amber-500/20' : 'border-slate-700 bg-slate-800') 
                    : 'border-red-900/50 bg-slate-800/50 opacity-60';
                
                let displayIconHTML = player.isAlive ? (isSpeaking ? '<span class="text-4xl">🎤</span>' : getIconHTML(player.icon, "w-12 h-12 text-4xl")) : '<span class="text-4xl">💀</span>';
                let voteCount = (roomData.phase === 'vote' && roomData.dayVotes) ? Object.values(roomData.dayVotes).filter(v => v === id).length : 0;
                let actionBtn = '';

                if (myData.isAlive && player.isAlive) {
                    if (roomData.phase === 'night') {
                        const elapsed = Math.floor((now - roomData.nightStartTime) / 1000);
                        if (elapsed < 15 && myData.role === '狼人' && id !== user.uid) {
                            let isSelected = roomData.nightActions?.wolfTarget === id;
                            actionBtn = `<button onclick="window.handleWolfAction('${id}')" class="text-xs ${isSelected ? 'bg-green-600' : 'bg-red-600 hover:bg-red-500'} px-3 py-1 rounded-full mt-2 w-full">${isSelected ? '✓ 已鎖定' : '襲擊'}</button>`;
                        }
                        if (elapsed >= 15 && elapsed < 30 && myData.role === '預言家' && id !== user.uid) {
                            let isSelected = roomData.nightActions?.seerTarget === id;
                            let hasChecked = !!roomData.nightActions?.seerTarget;
                            if (hasChecked) actionBtn = `<button disabled class="text-xs ${isSelected ? 'bg-green-600/70 text-slate-100' : 'bg-slate-700/50 text-slate-500'} px-3 py-1 rounded-full mt-2 w-full cursor-not-allowed">${isSelected ? '✓ 已查驗' : '查驗'}</button>`;
                            else actionBtn = `<button onclick="window.handleSeerAction('${id}')" class="text-xs bg-indigo-600 hover:bg-indigo-500 px-3 py-1 rounded-full mt-2 w-full">查驗</button>`;
                        }
                        if (elapsed >= 30 && myData.role === '女巫' && myData.hasPoison && id !== user.uid) {
                            let isSelected = roomData.nightActions?.witchPoisonTarget === id;
                            actionBtn = `<button onclick="window.handleWitchPoison('${id}')" class="text-xs ${isSelected ? 'bg-purple-800' : 'bg-purple-600 hover:bg-purple-500'} px-3 py-1 rounded-full mt-2 w-full">${isSelected ? '☠ 已毒殺' : '使用毒藥'}</button>`;
                        }
                    }
                    if (roomData.phase === 'vote') {
                        let isVoted = roomData.dayVotes?.[user.uid] === id;
                        actionBtn = `<button onclick="window.handleVote('${id}')" class="text-xs ${isVoted ? 'bg-green-600' : 'bg-amber-600 hover:bg-amber-500'} px-3 py-1 rounded-full mt-2 w-full font-bold">${isVoted ? '✓ 已投票' : '🗳️ 投給他'}</button>`;
                    }
                    if ((roomData.phase === 'day_speech' || roomData.phase === 'day_free' || roomData.phase === 'vote') && myData.role === '騎士' && myData.hasKnightAbility && id !== user.uid) {
                        actionBtn += `<button onclick="window.handleKnightDuel('${id}')" class="text-xs bg-amber-600 hover:bg-amber-500 px-3 py-1 rounded-full mt-1 w-full font-bold">⚔️ 決鬥</button>`;
                    }
                }

                return `<div class="p-4 rounded-xl border-2 flex flex-col items-center gap-2 transition-all relative ${cardClass}">
                    ${voteCount > 0 ? `<span class="absolute top-2 right-2 bg-amber-500 text-slate-900 text-xs font-bold px-2 py-0.5 rounded-full">${voteCount} 票</span>` : ''}
                    ${isSpeaking ? `<span class="absolute top-2 left-2 bg-amber-400 text-slate-950 text-xs font-bold px-2 py-0.5 rounded-full animate-pulse">發言中</span>` : ''}
                    <div class="mb-1 flex justify-center items-center w-12 h-12">${displayIconHTML}</div>
                    <span class="font-bold text-sm sm:text-base">${player.name}${id === user.uid ? ' (你)' : ''}</span>
                    ${actionBtn}
                </div>`;
            }).join('');

            let speechControlPanel = roomData.phase === 'day_speech' ? `
                <div class="mt-4 p-4 bg-amber-900/30 border border-amber-500/50 rounded-lg flex flex-col items-center gap-3">
                    <p class="text-amber-300 font-bold">📢 正在發言：<span class="text-white text-lg underline">${roomData.players[roomData.speechOrder?.[roomData.currentSpeakerIndex]]?.name || '玩家'}</span></p>
                    ${roomData.speechOrder?.[roomData.currentSpeakerIndex] === user.uid ? `<button onclick="window.nextSpeaker()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-2 rounded-lg shadow-lg animate-bounce">🎤 結束我的發言</button>` : `<p class="text-xs text-slate-400">請等待發言結束或玩家主動過單...</p>`}
                </div>` : '';

            let daySkipPanel = roomData.phase === 'day_free' && myData.isAlive ? `
                <div class="mt-4 p-4 bg-slate-700/60 border border-slate-600 rounded-lg flex flex-col sm:flex-row items-center justify-between gap-3">
                    <span class="text-sm text-slate-300">⏩ 跳過討論：<strong class="text-amber-400">${Object.keys(roomData.daySkips || {}).length}</strong> / ${Math.floor(totalAlive * 0.75) + 1} 人同意</span>
                    <button onclick="window.handleSkipDiscussion()" ${roomData.daySkips?.[user.uid] ? 'disabled' : ''} class="${roomData.daySkips?.[user.uid] ? 'bg-slate-600 text-slate-400' : 'bg-amber-600 hover:bg-amber-500 text-white'} text-sm font-bold px-4 py-2 rounded-lg">${roomData.daySkips?.[user.uid] ? '✓ 已要求跳過' : '⏩ 要求跳過討論'}</button>
                </div>` : '';

            let witchSpecialPanel = roomData.phase === 'night' && myData.role === '女巫' && myData.isAlive && Math.floor((now - roomData.nightStartTime) / 1000) >= 30 ? `
                <div class="mt-4 p-4 bg-purple-900/40 border border-purple-500 rounded-lg text-left">
                    <p class="text-purple-300 font-bold mb-2">🧪 女巫藥水面板：</p>
                    <p class="text-sm text-slate-300 mb-3">今晚被襲擊的玩家：<span class="text-red-400 font-bold">${roomData.nightActions?.wolfTarget ? roomData.players[roomData.nightActions.wolfTarget]?.name : "無人受害"}</span></p>
                    <div class="flex gap-2 flex-wrap">
                        ${myData.hasHeal && roomData.nightActions?.wolfTarget ? `
                            <button onclick="window.handleWitchHeal(true)" class="text-xs ${roomData.nightActions?.witchSave ? 'bg-green-600' : 'bg-emerald-600 hover:bg-emerald-500'} px-3 py-2 rounded-lg font-bold">${roomData.nightActions?.witchSave ? '✓ 已使用解藥' : '💚 使用解藥'}</button>
                            ${roomData.nightActions?.witchSave ? `<button onclick="window.handleWitchHeal(false)" class="text-xs bg-slate-600 px-3 py-2 rounded-lg">取消解藥</button>` : ''}
                        ` : `<span class="text-xs text-slate-500 bg-slate-800 p-2 rounded">解藥：${myData.hasHeal ? '無人需救' : '已使用過'}</span>`}
                        <span class="text-xs text-slate-400 self-center ml-auto">毒藥：${myData.hasPoison ? '可在下方點擊玩家毒殺' : '已使用過'}</span>
                    </div>
                </div>` : '';

            let knightPanel = myData.role === '騎士' && myData.isAlive && roomData.phase !== 'lobby' && roomData.phase !== 'night' ? `
                <div class="mt-4 p-3 bg-amber-900/40 border border-amber-500/60 rounded-lg text-left">
                    <p class="text-amber-300 font-bold text-sm">⚔️ 騎士專屬面板：</p>
                    <p class="text-xs text-slate-300 mt-1">${myData.hasKnightAbility ? '在發言、討論或投票階段，你點擊任意玩家卡片的「⚔️ 決鬥」即可發動技能。若對方是狼人則狼人死亡；若對方是好人則你自己以死謝罪！' : '你的騎士決鬥技能本局已使用過。'}</p>
                </div>
            ` : '';

            let hostControls = '';
            if(isHost) {
                if (roomData.phase === 'lobby') {
                    const s = roomData.roleSettings || { wolf: 1, seer: 1, witch: 1, knight: 0, villager: 0 };
                    const isReady = (s.wolf + s.seer + s.witch + (s.knight || 0) + s.villager) === allPlayers.length;
                    hostControls = `<button onclick="window.startGame()" class="${isReady ? 'bg-indigo-600 hover:bg-indigo-500' : 'bg-slate-600 cursor-not-allowed opacity-50'} px-6 py-2 rounded-lg font-bold">▶ 開始遊戲</button>`;
                }
                if (roomData.phase === 'night') hostControls = `<button onclick="window.endNight()" class="bg-orange-600 hover:bg-orange-500 px-6 py-2 rounded-lg font-bold">☀ 天亮了</button>`;
                if (roomData.phase === 'day_speech') hostControls = `<button onclick="window.nextSpeaker()" class="bg-amber-600 hover:bg-amber-500 px-6 py-2 rounded-lg font-bold">⏩ 下一位</button>`;
                if (roomData.phase === 'day_free') hostControls = `<button onclick="window.startVoting()" class="bg-amber-600 hover:bg-amber-500 px-6 py-2 rounded-lg font-bold">🗳️ 投票</button>`;
                if (roomData.phase === 'vote') hostControls = `<button onclick="window.endVoting()" class="bg-red-600 hover:bg-red-500 px-6 py-2 rounded-lg font-bold">⚖️ 開票</button>`;
                if (roomData.phase === 'game_over') hostControls = `<button onclick="window.returnToLobby()" class="bg-green-600 hover:bg-green-500 px-6 py-2 rounded-lg font-bold">🏠 回大廳</button>`;
            }

            let roleUI = roomData.phase !== 'lobby' ? `<div class="mt-4 p-4 bg-slate-700 inline-block rounded-lg border border-slate-600">
                <p class="text-sm text-slate-400 mb-1">你的身分</p>
                <p class="text-2xl font-bold ${myData.role === '狼人' ? 'text-red-400' : (myData.role === '女巫' ? 'text-purple-400' : (myData.role === '預言家' ? 'text-indigo-400' : (myData.role === '騎士' ? 'text-amber-400' : 'text-blue-400')))}">${myData.role}${!myData.isAlive ? ' (已死亡)' : ''}</p>
            </div>` : '';

            appDiv.innerHTML = `
                ${profileModalUI}
                <div class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700 mb-6 shadow-lg">
                    <div>
                        <h2 class="text-xl font-bold flex items-center gap-2">代碼：<span class="text-indigo-400 tracking-widest">${roomId}</span><button onclick="window.copyCode()" class="text-slate-400 hover:text-white ml-2 text-sm">📋複製</button></h2>
                        <div class="text-slate-300 text-sm mt-2 flex items-center gap-3">
                            <div class="w-8 h-8 rounded overflow-hidden flex justify-center items-center bg-slate-700">${getIconHTML(myData.icon, "w-full h-full text-xl")}</div> 
                            <span class="font-bold">${myData.name}</span>
                            <button onclick="window.openProfileEditor()" class="text-xs bg-slate-600 hover:bg-slate-500 px-2 py-1 rounded shadow transition">✏️ 編輯</button>
                            <button onclick="window.logout()" class="text-xs text-red-400 underline ml-2 hover:text-red-300">離開並登出</button>
                        </div>
                    </div>
                    <div class="text-right"><span class="px-4 py-1.5 rounded-full text-sm font-bold ${roomData.phase === 'night' ? 'bg-indigo-900 text-indigo-200' : (roomData.phase === 'vote' ? 'bg-amber-900 text-amber-200' : 'bg-slate-600')}">${phaseText}</span></div>
                </div>

                <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 mb-6 text-center shadow-lg">
                    <p class="text-lg md:text-xl text-slate-300 whitespace-pre-line">${roomData.systemMessage}</p>
                    ${roleSetupUI}
                    ${roleUI}
                    ${witchSpecialPanel}
                    ${knightPanel}
                    ${speechControlPanel}
                    ${daySkipPanel}
                </div>

                <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                    ${playersHTML}
                </div>

                ${isHost ? `<div class="bg-slate-800 p-4 rounded-xl border border-indigo-500/30 flex justify-center items-center gap-4 flex-wrap"><span class="text-lg hidden md:block">👑 房主控制：</span>${hostControls}</div>` : ''}
            `;
        }
    </script>
</body>
</html>
